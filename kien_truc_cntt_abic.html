<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiến trúc CNTT ABIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5; --panel:#ffffff; --panel-2:#f8faf9; --ink:#14201a; --ink-2:#4b5a52; --ink-3:#7c8a82;
  --line:#e2e8e4; --brand:#0a6e3c; --brand-2:#0d8a4b; --brand-soft:#e3f2ea; --accent:#c8102e;
  --side:#0b2e1e; --side-ink:#cfe3d8; --side-ink-2:#8fb3a0; --side-hover:#12402b; --side-active:#1a5a3b;
  --ok:#0d8a4b; --ok-bg:#e3f4ea; --warn:#a15c00; --warn-bg:#fff2dc; --info:#1f5fae; --info-bg:#e5effb;
  --pilot:#7a3fb0; --pilot-bg:#f1e8fa; --mute:#5d6b63; --mute-bg:#eef1ef;
  --shadow:0 1px 2px rgba(10,40,25,.06),0 4px 16px rgba(10,40,25,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1512; --panel:#151f1a; --panel-2:#1a2620; --ink:#e6efe9; --ink-2:#aebdb4; --ink-3:#7f9187;
    --line:#26352d; --brand:#3fbf7a; --brand-2:#5bd293; --brand-soft:#173427; --accent:#ff6b7f;
    --side:#08110d; --side-ink:#cfe3d8; --side-ink-2:#7fa18e; --side-hover:#11231a; --side-active:#1a3a2a;
    --ok:#5bd293; --ok-bg:#173427; --warn:#f0b35a; --warn-bg:#3a2a10; --info:#7fb2f0; --info-bg:#16283f;
    --pilot:#c49bf0; --pilot-bg:#2b1d3b; --mute:#a3b1a9; --mute-bg:#22302a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1512; --panel:#151f1a; --panel-2:#1a2620; --ink:#e6efe9; --ink-2:#aebdb4; --ink-3:#7f9187;
  --line:#26352d; --brand:#3fbf7a; --brand-2:#5bd293; --brand-soft:#173427; --accent:#ff6b7f;
  --side:#08110d; --side-ink:#cfe3d8; --side-ink-2:#7fa18e; --side-hover:#11231a; --side-active:#1a3a2a;
  --ok:#5bd293; --ok-bg:#173427; --warn:#f0b35a; --warn-bg:#3a2a10; --info:#7fb2f0; --info-bg:#16283f;
  --pilot:#c49bf0; --pilot-bg:#2b1d3b; --mute:#a3b1a9; --mute-bg:#22302a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:272px 1fr;height:100vh}
/* Sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#fff}
.brand .logo i{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#0d8a4b,#0a6e3c);display:grid;place-items:center;font-style:normal;font-size:13px;letter-spacing:.5px}
.brand small{display:block;color:var(--side-ink-2);font-size:12px;margin-top:6px}
.nav{flex:1;overflow:auto;padding:10px 10px 16px}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-ink-2);padding:14px 12px 6px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--side-ink);font-size:13.5px}
.nav button:hover{background:var(--side-hover)}
.nav button:focus-visible{outline:2px solid var(--brand-2)}
.nav button.active{background:var(--side-active);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #3fbf7a}
.nav .num{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.07);color:var(--side-ink)}
.nav button.active .num{background:#3fbf7a;color:#08110d}
.side-foot{padding:12px 20px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:var(--side-ink-2);display:flex;justify-content:space-between;align-items:center}
.side-foot button{all:unset;cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.15);color:var(--side-ink)}
/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .crumb{color:var(--ink-3);font-size:12.5px}
.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.top .spacer{flex:1}
.top .pager{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:12.5px}
.top .pager button{all:unset;cursor:pointer;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);background:var(--panel)}
.top .pager button:hover{border-color:var(--brand);color:var(--brand)}
.menu-btn{all:unset;display:none;cursor:pointer;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);place-items:center}
.content{flex:1;overflow:auto;padding:24px 28px 48px}
.content > section{max-width:1240px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lead{color:var(--ink-2);font-size:14.5px;max-width:880px;margin:0 0 20px}
h2{font-size:15px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
h2 .tag{font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
h3{font-size:13.5px;margin:0 0 8px;font-weight:600}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.content > section > * + *, .card-stack > * + *{margin-top:16px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--brand);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink-2);font-size:12.5px;margin-top:4px}
.kpi .s{color:var(--ink-3);font-size:11.5px;margin-top:2px}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:4px 0}
ul.clean li::marker{color:var(--brand)}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel-2);font-weight:600;color:var(--ink-2);font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
td.code,.mono{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
/* chips & badges */
.c{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand);cursor:pointer;white-space:nowrap;margin:1px 0}
.c:hover{outline:1px solid var(--brand)}
.b{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b.ok{background:var(--ok-bg);color:var(--ok)}
.b.warn{background:var(--warn-bg);color:var(--warn)}
.b.info{background:var(--info-bg);color:var(--info)}
.b.pilot{background:var(--pilot-bg);color:var(--pilot)}
.b.mute{background:var(--mute-bg);color:var(--mute)}
.lvl{display:inline-flex;gap:2px;vertical-align:middle}
.lvl i{width:6px;height:12px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--brand)}
/* layered diagram */
.layers{display:flex;flex-direction:column;gap:8px}
.layer{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:stretch}
.layer .ln{background:var(--brand);color:#fff;border-radius:8px;padding:10px 12px;font-weight:600;font-size:12.5px;display:flex;flex-direction:column;justify-content:center}
.layer .ln small{font-weight:400;opacity:.85;font-size:11px}
.layer .lc{background:var(--panel-2);border:1px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px}
.node{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
.node b{color:var(--brand);font-weight:600;margin-right:4px}
.node:hover{border-color:var(--brand)}
.node.dim{opacity:.6;border-style:dashed}
/* principles */
.pr{display:flex;flex-direction:column;gap:8px}
.pr .pc{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.pr h3{font-size:14.5px;margin:0}
.pr p{margin:0;color:var(--ink-2);font-size:13px}
.pr .ap{margin-top:auto;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:8px}
/* flows */
.flow{counter-reset:s;display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.flow li{position:relative;padding:0 0 14px 38px;color:var(--ink-2)}
.flow li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.flow li::after{content:"";position:absolute;left:12px;top:28px;bottom:2px;width:2px;background:var(--line)}
.flow li:last-child::after{display:none}
.flow li:last-child{padding-bottom:0}
/* bars */
.bar{display:grid;grid-template-columns:1fr 70px;align-items:center;gap:8px;font-size:12px}
.bar .t{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar span{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
/* capability map */
.cap h3{color:var(--brand);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.cap .it{padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.cap .it:first-of-type{border-top:0}
.cap .it div{margin-top:3px}
/* zones */
.zone{border-radius:10px;padding:14px;border:1px solid var(--line);background:var(--panel-2)}
.zone h3{display:flex;justify-content:space-between;align-items:center}
.zone .srv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding-bottom:16px}
.tl .ev::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:3px solid var(--brand)}
.tl .ev .d{font-size:12px;color:var(--brand);font-weight:700}
.tl .ev .n{font-weight:600}
.tl .ev .x{color:var(--ink-2);font-size:12.5px}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input{flex:1;min-width:200px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.filters input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.pill{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);background:var(--panel)}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.count{color:var(--ink-3);font-size:12px;margin-left:auto}
.note{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.callout{border-left:3px solid var(--brand);background:var(--brand-soft);padding:12px 14px;border-radius:0 8px 8px 0;font-size:13px}
/* architecture map */
.arch{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.acol{flex:1 1 0;min-width:128px;border-radius:12px;background:var(--lc-bg);border:1px solid var(--lc-bd);padding:10px;display:flex;flex-direction:column;gap:10px}
.acol.wide{flex:1.9 1 0;min-width:230px}
.acol .ah,.aband .ah{border-radius:8px;background:var(--lc);color:#fff;padding:8px 10px}
.ah b{display:block;font-size:12.5px;line-height:1.3}
.ah small{font-size:11px;opacity:.85}
.agt{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--lc-ink);font-weight:700;margin:0 2px 5px}
.agn{display:flex;flex-direction:column;gap:6px}
.acol.wide .agn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.an{background:var(--panel);border:1px solid var(--lc-bd);border-left:3px solid var(--lc);border-radius:7px;padding:6px 8px;cursor:pointer;min-width:0;transition:transform .12s,box-shadow .12s}
.an:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--lc)}
.an b{display:block;font-size:10.5px;color:var(--lc-ink);letter-spacing:.03em}
.an span{display:block;font-size:12px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.arrow{flex:none;width:22px;align-self:center;height:22px;position:relative}
.arrow::before{content:"";position:absolute;left:3px;right:6px;top:10px;height:2px;background:var(--ink-3)}
.arrow::after{content:"";position:absolute;right:2px;top:6px;border:5px solid transparent;border-left:7px solid var(--ink-3);border-right:0}
.aband{--lc:#5b6770;--lc-bg:var(--panel-2);--lc-bd:var(--line);--lc-ink:var(--ink-2);margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel-2)}
.aband .agn{flex-direction:row;flex-wrap:wrap}
.aband .bnote{font-size:12px;color:var(--ink-3)}
.acol.nd{--lc:#3d5a80;--lc-bg:#eef2f8;--lc-bd:#d5deeb;--lc-ink:#3d5a80}
.acol.tb{--lc:#0a6e3c;--lc-bg:#eaf5ef;--lc-bd:#cfe6d9;--lc-ink:#0a6e3c}
.acol.th{--lc:#b35c00;--lc-bg:#fdf3e7;--lc-bd:#f1dcc0;--lc-ink:#a15300}
.acol.nv{--lc:#6a3fa0;--lc-bg:#f3eefa;--lc-bd:#e0d4ef;--lc-ink:#6a3fa0}
.acol.dl{--lc:#1f5fae;--lc-bg:#ebf2fb;--lc-bd:#d0dff2;--lc-ink:#1f5fae}
.acol.ng{--lc:#8a4b2c;--lc-bg:#f7efea;--lc-bd:#e8d8cd;--lc-ink:#8a4b2c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .acol.nd{--lc:#4f75a8;--lc-bg:#172131;--lc-bd:#26344a;--lc-ink:#9dbbe6}
:root:not([data-theme="light"]) .acol.tb{--lc:#1f8a55;--lc-bg:#13261c;--lc-bd:#1f3b2c;--lc-ink:#7fd6a5}
:root:not([data-theme="light"]) .acol.th{--lc:#b36a14;--lc-bg:#2a1f12;--lc-bd:#3f2f1b;--lc-ink:#f0b76a}
:root:not([data-theme="light"]) .acol.nv{--lc:#7a52b3;--lc-bg:#211a2e;--lc-bd:#33284a;--lc-ink:#c4a6ef}
:root:not([data-theme="light"]) .acol.dl{--lc:#2f6fc0;--lc-bg:#14213a;--lc-bd:#22344f;--lc-ink:#8fbaf0}
:root:not([data-theme="light"]) .acol.ng{--lc:#9a5a38;--lc-bg:#271b15;--lc-bd:#3d2a20;--lc-ink:#e3a988}
}
:root[data-theme="dark"] .acol.nd{--lc:#4f75a8;--lc-bg:#172131;--lc-bd:#26344a;--lc-ink:#9dbbe6}
:root[data-theme="dark"] .acol.tb{--lc:#1f8a55;--lc-bg:#13261c;--lc-bd:#1f3b2c;--lc-ink:#7fd6a5}
:root[data-theme="dark"] .acol.th{--lc:#b36a14;--lc-bg:#2a1f12;--lc-bd:#3f2f1b;--lc-ink:#f0b76a}
:root[data-theme="dark"] .acol.nv{--lc:#7a52b3;--lc-bg:#211a2e;--lc-bd:#33284a;--lc-ink:#c4a6ef}
:root[data-theme="dark"] .acol.dl{--lc:#2f6fc0;--lc-bg:#14213a;--lc-bd:#22344f;--lc-ink:#8fbaf0}
:root[data-theme="dark"] .acol.ng{--lc:#9a5a38;--lc-bg:#271b15;--lc-bd:#3d2a20;--lc-ink:#e3a988}
/* key points */
.key{border:1px solid var(--brand);border-top:4px solid var(--brand);background:linear-gradient(180deg,var(--brand-soft),var(--panel) 90px);display:flex;flex-direction:column;gap:12px}
.key .kh{display:flex;gap:12px;align-items:center}
.key .kn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.key .kt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);font-weight:700}
.key h3{font-size:16px;margin:2px 0 0;line-height:1.3}
.key p{margin:0;color:var(--ink-2);font-size:13.5px}
.gates{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.gate{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1.3fr);align-items:center}
.gw{font-size:12.5px;color:var(--ink-2);text-align:right}
.gn{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:7px 10px;font-size:12.5px}
.gn b{margin-right:6px}
.gn small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.ga{height:22px;position:relative}
.ga::before{content:"";position:absolute;left:4px;right:8px;top:10px;height:2px;background:var(--brand)}
.ga::after{content:"";position:absolute;right:3px;top:6px;border:5px solid transparent;border-left:7px solid var(--brand);border-right:0}
.qflow{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr);align-items:stretch;margin-top:auto}
.qflow .ga{align-self:center}
.qs{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12.5px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.qs small{display:block;color:var(--ink-3);font-size:11px;margin-top:3px}
.qs:first-child{border-color:var(--info);background:var(--info-bg)}
.qno{font-size:12.5px;color:var(--accent);font-weight:600;display:flex;gap:8px;align-items:center}
.qno span{width:20px;height:20px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-size:11px}
.arch.hl .an{opacity:.3}
.arch.hl .an.on{opacity:1;box-shadow:0 0 0 2px var(--lc);transform:translateY(-1px)}
abbr.gl{text-decoration:underline dotted color-mix(in srgb,var(--brand) 55%,transparent);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help}
abbr.gl:hover{background:var(--brand-soft);border-radius:3px}
.cns{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px}
.cn{white-space:nowrap;font-size:12.5px;color:var(--ink-2)}
.cn .c{margin-right:2px}
/* tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--panel);padding:8px 10px;border-radius:8px;font-size:12px;max-width:340px;opacity:0;transition:opacity .12s;box-shadow:var(--shadow)}
#tip b{display:block;margin-bottom:2px;font-size:12.5px}
#tip .td{opacity:.9;margin-bottom:6px}
#tip dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;padding-top:6px;border-top:1px solid color-mix(in srgb,var(--panel) 25%,transparent)}
#tip dt{opacity:.65;white-space:nowrap}
#tip dd{margin:0;font-weight:600}
#tip .tl2{margin-top:6px;font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.05em}
.scrim{display:none}
.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.z5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.k6,.z5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}

const esc = s => String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
// Biến mã thành phần / kết nối trong văn bản thành chip có tooltip
const CODE_RE = /\b(ND|TB|TH|NV|DL|HT|NG|KN)(\d{2})\b/g;
function L(s){
  return esc(s).replace(CODE_RE,(m)=> (BY[m]||KN_BY[m]) ? `<span class="c" data-code="${m}">${m}</span>` : m);
}
function badge(st){
  if(!st) return "";
  const cls = {"Vận hành":"ok","Đang triển khai":"info","Đang xây dựng":"warn","Thí điểm":"pilot","Chuyển vào ClosedAPI":"mute","Độc lập":"mute"}[st]||"mute";
  return `<span class="b ${cls}">${esc(st)}</span>`;
}
function lvl(v){
  if(!v) return `<span style="color:var(--ink-3)">—</span>`;
  const hi = parseInt(v.split("–").pop(),10), lo = parseInt(v,10);
  let h='<span class="lvl" title="Mức '+esc(v)+'">';
  for(let i=1;i<=5;i++) h+=`<i class="${i<=hi?'on':''}" style="${i<=hi&&i>lo?'opacity:.45':''}"></i>`;
  return h+`</span> <span style="font-size:12px;color:var(--ink-2)">${esc(v)}</span>`;
}
function table(head, rows, opts={}){
  return `<div class="tbl-wrap"${opts.max?` style="max-height:${opts.max}px"`:""}><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0&&opts.codeCol!==false?' class="code"':''}>${c}</td>`).join("")}</tr>`).join("")
  }</tbody></table></div>`;
}
const T = (head, rows, opts) => table(head, rows.map(r=>r.map(c=>L(c))), opts);

const SHORT = {TB01:"Nghiệp vụ bảo hiểm",TB02:"Tài chính kế toán",TB20:"Web bán hàng",NG01:"Agribank thu phí",NG02:"Agribank TT dữ liệu",NG03:"Agribank web banca",NG05:"JETPAY, SmartMoney",NG10:"Google Workspace",NV09:"KtKySo"};
const shortName = c => SHORT[c] || (BY[c] ? BY[c].name.replace(/ \(VB6\)/,"") : "");
function LN(str){
  // mở rộng dải mã (vd NG08–NG10) thành từng mã
  str=str.replace(/\b([A-Z]{2})(\d{2})–\1(\d{2})\b/g,(_,p,a,b)=>{const o=[];for(let i=+a;i<=+b;i++)o.push(p+String(i).padStart(2,"0"));return o.join(", ");});
  return str.split(/,\s*/).map(item=>{
    const m=item.match(/^(ND|TB|TH|NV|DL|HT|NG)(\d{2})(?:\s.*)?$/);
    if(!m || item.includes("–")) return `<span class="cn">${L(item)}</span>`;
    const code=m[1]+m[2], nm=shortName(code);
    return `<span class="cn">${BY[code]?L(code):`<span class="c" style="cursor:default;opacity:.7">${code}</span>`}${nm?` <span>${esc(nm)}</span>`:""}</span>`;
  }).join("");
}
const card = (title, body, tag) => `<div class="card">${title?`<h2>${esc(title)}${tag?` <span class="tag">${esc(tag)}</span>`:""}</h2>`:""}${body}</div>`;

{ id:"appA", num:"A", group:"Phụ lục", title:"Danh mục thành phần", render(){
  const layers=["Tất cả",...new Set(COMP.map(c=>c.layer))];
  return `
  <p class="lead">Mỗi thành phần có một mã duy nhất; mọi sơ đồ và danh mục kết nối dùng đúng mã, tên ở đây. Mức là mức quan trọng 1–5 (5 cao nhất): hỏng thì thiệt hại kinh doanh đến đâu.</p>
  <div class="filters" id="fA">${layers.map((l,i)=>`<button class="pill${i?'':' on'}" data-l="${l}" type="button">${l}</button>`).join("")}<input id="qA" placeholder="Tìm mã, tên, công nghệ, mô tả…" type="search"></div>
  <div class="card" style="padding:0;overflow:hidden"><div id="tA"></div></div>`;
}, mount(){
  let layer="Tất cả", q="";
  const draw=()=>{
    const qq=q.toLowerCase();
    const rows=COMP.filter(c=>(layer==="Tất cả"||c.layer===layer)&&(!qq||Object.values(c).join(" ").toLowerCase().includes(qq)));
    const tA=document.getElementById("tA"); tA.innerHTML = table(["Mã","Tên","Lớp","Loại","Vùng mạng","Công nghệ","Mức","Trạng thái","Mô tả"],
      rows.map(c=>[`<span class="c" data-code="${c.code}">${c.code}</span>`,`<b>${esc(c.name)}</b>`,esc(c.layer),esc(c.type),esc(c.zone||"—"),esc(c.tech||"—"),lvl(c.lvl),badge(c.status),esc(c.desc)]),{max:640})
      +`<div class="note" style="padding:0 14px 12px">${rows.length} / ${COMP.length} thành phần</div>`;
    glossify(tA);
  };
  document.querySelectorAll("#fA .pill").forEach(b=>b.onclick=()=>{document.querySelectorAll("#fA .pill").forEach(x=>x.classList.remove("on"));b.classList.add("on");layer=b.dataset.l;draw();});
  const qi=document.getElementById("qA"); qi.oninput=()=>{q=qi.value;draw();};
  if(PENDING){qi.value=PENDING;q=PENDING;PENDING="";}
  draw();
}},

/* Gắn tooltip nghĩa cho các thuật ngữ ở mục 1.5 */
const GL_MAP = Object.fromEntries(GLOSS.map(([t,m])=>[t.toLowerCase(),[t,m]]));
const GL_RE = new RegExp("(?<![\\p{L}\\p{N}_])(" + GLOSS.map(g=>g[0]).sort((a,b)=>b.length-a.length)
  .map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/ /g,"\\s+")).join("|") + ")(?![\\p{L}\\p{N}_])","giu");
const GL_SKIP = ".cn,[data-code],[data-term],.no-gl,th,input,button,script,style,#tip,.kt,h1";
function glossify(root){
  if(!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>
    !n.nodeValue.trim()||n.parentElement.closest(GL_SKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const t=n.nodeValue; GL_RE.lastIndex=0; if(!GL_RE.test(t)) return;
    const f=document.createDocumentFragment(); let last=0; GL_RE.lastIndex=0; let m;
    while((m=GL_RE.exec(t))){
      f.append(t.slice(last,m.index));
      const key=m[1].replace(/\s+/g," ").toLowerCase();
      const a=document.createElement("abbr"); a.className="gl"; a.dataset.term=GL_MAP[key][0]; a.textContent=m[1];
      f.append(a); last=m.index+m[1].length;
    }
    f.append(t.slice(last)); n.replaceWith(f);
  });
}

/* ========== ĐIỀU HƯỚNG ========== */
let CUR = 0, PENDING = "";
const $ = id => document.getElementById(id);
function buildNav(){
  let h="", g="";
  SECTIONS.forEach((s,i)=>{
    if(s.group!==g){ g=s.group; h+=`<div class="grp">${g}</div>`; }
    h+=`<button type="button" data-i="${i}"><span class="num">${s.num}</span>${esc(s.title)}</button>`;
  });
  $("nav").innerHTML=h;
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{go(+b.dataset.i);closeMenu();});
}
function go(i){
  CUR=(i+SECTIONS.length)%SECTIONS.length;
  const s=SECTIONS[CUR];
  $("nav").querySelectorAll("button").forEach(b=>b.classList.toggle("active",+b.dataset.i===CUR));
  $("title").textContent=s.title;
  $("crumb").textContent = s.group==="Phụ lục" ? `Phụ lục ${s.num}` : s.group==="Nội dung" ? `Chương ${s.num}` : "Kiến trúc CNTT ABIC";
  $("pos").textContent=`${CUR+1} / ${SECTIONS.length}`;
  $("content").innerHTML=`<section>${s.render()}</section>`;
  $("content").scrollTop=0;
  s.mount && s.mount();
  glossify($("content"));
  try{ history.replaceState(null,"","#"+s.id); }catch(e){}
}
$("prev").onclick=()=>go(CUR-1);
$("next").onclick=()=>go(CUR+1);
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==="ArrowRight"||e.key==="PageDown") go(CUR+1);
  if(e.key==="ArrowLeft"||e.key==="PageUp") go(CUR-1);
});
// Menu di động
const closeMenu=()=>{$("side").classList.remove("open");$("scrim").classList.remove("open");};
$("menuBtn").onclick=()=>{$("side").classList.add("open");$("scrim").classList.add("open");};
$("scrim").onclick=closeMenu;
// Giao diện sáng/tối
$("theme").onclick=()=>{
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try{ localStorage.setItem("abic-theme", r.dataset.theme); }catch(e){}
};
try{ const t=localStorage.getItem("abic-theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
// Tooltip + bấm mã để mở danh mục
const tip=$("tip");
document.addEventListener("mouseover",e=>{
  const g=e.target.closest("[data-term]");
  if(g){ const [t,m]=GL_MAP[g.dataset.term.toLowerCase()]; tip.innerHTML=`<b>${esc(t)}</b><div class="td" style="margin:0">${esc(m)}</div><div class="tl2">Thuật ngữ · mục 1.5</div>`; tip.style.opacity=1; return; }
  const el=e.target.closest("[data-code]"); if(!el){tip.style.opacity=0;return;}
  const code=el.dataset.code, c=BY[code], k=KN_BY[code];
  if(c){
    const rows=[["Loại",c.type],["Vùng mạng",c.zone],["Công nghệ",c.tech],["Mức",c.lvl],["Trạng thái",c.status]].filter(r=>r[1]);
    tip.innerHTML=`<b>${code} · ${esc(c.name)}</b><div class="td">${esc(c.desc)}</div><dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl><div class="tl2">${esc(c.layer)}</div>`;
  }
  else if(k) tip.innerHTML=`<b>${code} · ${esc(k.what)}</b>${esc(k.src)} → ${esc(k.dst)}<br><span style="opacity:.75">${esc(k.how)}</span>`;
  else return;
  tip.style.opacity=1;
});
document.addEventListener("mousemove",e=>{
  if(tip.style.opacity!=="1") return;
  const w=tip.offsetWidth, h=tip.offsetHeight;
  tip.style.left=Math.min(e.clientX+14, innerWidth-w-8)+"px";
  tip.style.top=(e.clientY+h+24>innerHeight? e.clientY-h-12 : e.clientY+16)+"px";
});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-code]"); if(!el) return;
  const code=el.dataset.code;
  const target = KN_BY[code] ? "appB" : "appA";
  if(SECTIONS[CUR].id===target){ const qi=$(target==="appA"?"qA":"qB"); qi.value=code; qi.dispatchEvent(new Event("input")); return; }
  PENDING=code; tip.style.opacity=0;
  go(SECTIONS.findIndex(s=>s.id===target));
});
// Điểm then chốt: làm nổi các thành phần liên quan trên sơ đồ
document.addEventListener("mouseover",e=>{
  const k=e.target.closest(".key[data-hl]"), arch=document.querySelector(".arch");
  if(!arch) return;
  const codes=k?k.dataset.hl.split(","):[];
  arch.classList.toggle("hl",!!k);
  arch.querySelectorAll(".an").forEach(n=>n.classList.toggle("on",codes.includes(n.dataset.code)));
});
buildNav();
const start = SECTIONS.findIndex(s=>"#"+s.id===location.hash);
go(start>=0?start:0);
</script>
