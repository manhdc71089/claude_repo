<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Ký số ATTK 2086</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:20px;background:#fff;color:#222}
button{padding:8px 16px;font-size:15px;margin-right:8px}
table{border-collapse:collapse;margin-top:12px}td,th{border:1px solid #ccc;padding:3px 8px;font-size:13px}
.ok{color:#080}.err{color:#c00}
</style></head><body>
<h3>Ký số ATTK – file 2086 (<span id="tong"></span> hồ sơ)</h3>
<p>Bấm <b>Bắt đầu</b> để gọi API ký số lần lượt cho từng SO_ID_YC. Trình duyệt không đọc được nội dung trả về
(khác domain), nên cột trạng thái chỉ cho biết yêu cầu đã gửi đi được hay chưa. Muốn xem kết quả của 1 hồ sơ, bấm vào link của hồ sơ đó.</p>
<button id="start">Bắt đầu</button><button id="stop">Dừng</button> <span id="tt"></span>
<table><thead><tr><th>#</th><th>SO_ID_YC</th><th>Trạng thái</th></tr></thead><tbody id="ds"></tbody></table>
<script>
const API = "http://sign.abic.com.vn/bancaapi/attk/sign?b_so_id=";
const ids = "26092600059334,26092600059336,26092600059338,26092600059340,26092600059342,26092600059344,26092600059346,26092600059348,26092600059350,26092600059352,26092600059354,26092600059356,26092600059360,26092600059362,26092600059364,26092600059368,26092600059370,26092600059372,26092600059374,26092600059376,26092600059378,26092600059380,26092600059358,26092600059382,26092600059384,26092600059386,26092600059388,26092600059390,26092600059392,26092600059394,26092600059396,26092600059398,26092600059400,26092600059402,26092600059404,26092600059406,26092600059408,26092600059410,26092600059412,26092600059414,26092600059416,26092600059418,26092600059420,26092600059422,26092600059424,26092600059426,26092600059428,26092600059430,26092600059432,26092600059434,26092600059436,26092600059438,26092600059440,26092600059442,26092600059444,26092600059446,26092600059448,26092600059450,26092600059296,26092600059298,26092600059300,26092600059304,26092600059294,26092600059306,26092600059308,26092600059310,26092600059312,26092600059314,26092600059316,26092600059318,26092600059320,26092600059322,26092600059324,26092600059326,26092600059328,26092600059330,26092600059332");
const tb = document.getElementById("ds"), tt = document.getElementById("tt");
document.getElementById("tong").textContent = ids.length;
ids.forEach((id, i) => tb.insertAdjacentHTML("beforeend",
  '<tr><td>' + (i + 1) + '</td><td><a target="_blank" href="' + API + id + '">' + id + '</a></td><td id="s' + i + '"></td></tr>'));
let dung = false;
document.getElementById("stop").onclick = () => dung = true;
document.getElementById("start").onclick = async () => {
  dung = false; let ok = 0, loi = 0;
  for (let i = 0; i < ids.length && !dung; i++) {
    const c = document.getElementById("s" + i);
    if (c.className === "ok") continue;           // bo qua ho so da gui thanh cong
    c.textContent = "đang gửi..."; c.className = "";
    try { await fetch(API + ids[i], { mode: "no-cors", cache: "no-store" }); c.textContent = "đã gửi"; c.className = "ok"; ok++; }
    catch (e) { c.textContent = "lỗi kết nối"; c.className = "err"; loi++; }
    tt.textContent = (i + 1) + "/" + ids.length + " – đã gửi: " + ok + ", lỗi: " + loi;
  }
};
</script></body></html>
